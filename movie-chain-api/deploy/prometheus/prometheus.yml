# Local Prometheus for CineChain. Runs on the host network (see docker-compose.yml).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts/cinechain.rules.yml

scrape_configs:
  # Application plane: GET /api/v1/metrics answers loopback callers (or METRICS_TOKEN).
  - job_name: cinechain-api
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ['localhost:3000']

  # Control plane: 127.0.0.1 only. Exports cinechain_onboarding_stuck_runs.
  - job_name: cinechain-control
    metrics_path: /admin/metrics
    static_configs:
      - targets: ['127.0.0.1:3001']

  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9090']
