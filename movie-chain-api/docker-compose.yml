# Local infrastructure for the CineChain API — smallest images that do the job.
# Host ports avoid the native services on this machine:
#   Postgres 5432 (v17) and 5433 (v18) are taken -> 5434
#   Redis 6379 is taken                         -> 6380
#   Grafana's default 3000 is the API           -> 3030
#
# Observability (Prometheus, Loki, Alloy, Grafana) is a PROFILE, so the default
# `docker compose up -d` stays light:
#   docker compose --profile observability up -d
name: cinechain

x-minio-env: &minio-env
  MINIO_ROOT_USER: cinechain
  MINIO_ROOT_PASSWORD: cinechain-minio-secret
  # Lets the bundled `mc` reach this server without an `alias set`.
  MC_HOST_local: http://cinechain:cinechain-minio-secret@localhost:9000

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cinechain_admin
      POSTGRES_PASSWORD: cinechain_admin
      POSTGRES_DB: cinechain
    ports: ["127.0.0.1:5434:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinechain_admin -d cinechain"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6380:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object storage: posters (step 10), exports (steps 22, 27).
  # The official minio/* images are no longer publicly pullable; Chainguard's
  # Wolfi-based image is minimal and ships `mc`, so no separate client image.
  minio:
    image: cgr.dev/chainguard/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment: *minio-env
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: create the private bucket, then exit.
  minio-init:
    image: cgr.dev/chainguard/minio:latest
    depends_on:
      minio: { condition: service_healthy }
    environment:
      MC_HOST_local: http://cinechain:cinechain-minio-secret@minio:9000
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc mb --ignore-existing local/cinechain-media &&
        mc anonymous set none local/cinechain-media &&
        echo 'bucket cinechain-media ready (private)'
    restart: "no"

  # ---------------------------------------------------------------- observability
  # Scrapes both planes' /metrics and evaluates deploy/alerts/cinechain.rules.yml.
  # HOST networking on purpose: the API's metrics endpoint answers loopback only,
  # and the control plane listens on 127.0.0.1 only. A bridged container could
  # reach neither without weakening those rules. (Native Linux engine.)
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [observability]
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.listen-address=127.0.0.1:9090
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/alerts:/etc/prometheus/alerts:ro
      - promdata:/prometheus

  # Log store. Single binary, filesystem storage: fine for one machine.
  loki:
    image: grafana/loki:3.5.5
    profiles: [observability]
    command: ["-config.file=/etc/loki/loki.yml"]
    ports: ["127.0.0.1:3100:3100"]
    volumes:
      - ./deploy/loki/loki.yml:/etc/loki/loki.yml:ro
      - lokidata:/loki

  # Ships the API's JSON log files (LOG_FILE=logs/*.log) to Loki.
  alloy:
    image: grafana/alloy:v1.10.2
    profiles: [observability]
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy", "/etc/alloy/config.alloy"]
    ports: ["127.0.0.1:12345:12345"]
    depends_on: [loki]
    volumes:
      - ./deploy/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ./logs:/var/log/cinechain:ro
      - alloydata:/var/lib/alloy

  # HOST networking too, bound to 127.0.0.1:3030, so it reaches Prometheus
  # (loopback-only, above) and Loki (published on 127.0.0.1:3100) without
  # either being exposed beyond this machine.
  grafana:
    image: grafana/grafana:12.2.0
    profiles: [observability]
    network_mode: host
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: "3030"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: cinechain-grafana   # local development only
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    depends_on: [loki]
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana

volumes:
  pgdata:
  redisdata:
  miniodata:
  promdata:
  lokidata:
  alloydata:
  grafanadata:
