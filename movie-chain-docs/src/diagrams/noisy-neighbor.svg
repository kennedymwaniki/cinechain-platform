<svg viewBox="0 0 720 262" role="img">
<text class="s-cap" x="0" y="11">The noisy neighbour — one tenant's big night ruins everyone else's</text>
<rect class="b-dash" x="0" y="20" width="350" height="150" rx="6"/>
<text class="s-hd" x="12" y="38">Friday 18:00 — Avengers tickets drop</text>
<rect class="b-rd" x="12" y="48" width="326" height="42" rx="4"/>
<text class="s-lb" x="22" y="65">Nyati Cinemas — 40 000 requests/min</text>
<rect class="b-n" x="22" y="72" width="280" height="12" rx="2"/>
<text class="s-xs" x="310" y="82">96%</text>
<rect class="b-w" x="12" y="96" width="326" height="30" rx="4"/>
<text class="s-sm" x="22" y="108">Prestige Screens — 80 requests/min</text>
<rect class="b-bl" x="22" y="114" width="10" height="8" rx="2"/><text class="s-xs" x="310" y="121">2%</text>
<rect class="b-w" x="12" y="130" width="326" height="30" rx="4"/>
<text class="s-sm" x="22" y="142">Sarit Filmhouse — 60 requests/min</text>
<rect class="b-bl" x="22" y="148" width="8" height="8" rx="2"/><text class="s-xs" x="310" y="155">2%</text>
<rect class="b-rd" x="0" y="178" width="350" height="76" rx="5"/>
<text class="s-hd" x="12" y="196">What Prestige experiences</text>
<text class="s-sm" x="12" y="213">Their box office crawls. Their customers abandon.</text>
<text class="s-sm" x="12" y="228">They did nothing wrong and have no idea why.</text>
<text class="s-sm" x="12" y="245">They phone support. They threaten to leave.</text>

<rect class="b-gr" x="370" y="20" width="350" height="150" rx="6"/>
<text class="s-hd" x="382" y="38">Four defences, cheapest first</text>
<rect class="b" x="382" y="46" width="326" height="27"/>
<text class="s-lb" x="390" y="58">1 · Per-tenant rate limits</text>
<text class="s-xs" x="390" y="69">A tenant can burst, but not without bound</text>
<rect class="b" x="382" y="77" width="326" height="27"/>
<text class="s-lb" x="390" y="89">2 · Fair queueing</text>
<text class="s-xs" x="390" y="100">Round-robin across tenants, not first-come-first-served</text>
<rect class="b" x="382" y="108" width="326" height="27"/>
<text class="s-lb" x="390" y="120">3 · Connection &amp; concurrency caps</text>
<text class="s-xs" x="390" y="131">One tenant cannot take every DB connection</text>
<rect class="b-am" x="382" y="139" width="326" height="27"/>
<text class="s-lb" x="390" y="151">4 · Move them to a silo</text>
<text class="s-xs" x="390" y="162">When a tenant is permanently outsized, stop fighting it</text>
<rect class="b-w" x="370" y="178" width="350" height="76" rx="5"/>
<text class="s-hd" x="382" y="196">The part teams miss</text>
<text class="s-sm" x="382" y="213">You cannot fix what you cannot see. If your metrics</text>
<text class="s-sm" x="382" y="228">say &quot;p99 = 2.1s&quot; with no tenant dimension, you will</text>
<text class="s-sm" x="382" y="245">never find the neighbour. Tag every metric by tenant.</text>
</svg>
