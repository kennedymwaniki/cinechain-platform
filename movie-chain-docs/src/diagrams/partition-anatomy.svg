<svg viewBox="0 0 720 386" role="img">
<text class="s-cap" x="0" y="11">The same question — &quot;give me booking 4471&quot; — under each model</text>

<rect class="b-am" x="0" y="20" width="720" height="106" rx="5"/>
<text class="s-hd" x="10" y="38">A · Shared table, tenant discriminator</text>
<text class="s-xs" x="10" y="52">One database · one schema · one set of tables · a tenant_id column on every row</text>
<rect class="b" x="10" y="58" width="336" height="60"/>
<text class="s-mono" x="18" y="72">booking</text>
<rect class="b-w" x="18" y="77" width="320" height="12"/><text class="s-mono" x="22" y="86">nyati    | 4471 | E6 | CONFIRMED</text>
<rect x="18" y="90" width="320" height="12" fill="#fff" stroke="var(--rule)"/><text class="s-mono" x="22" y="99">prestige | 4471 | C4 | HELD</text>
<rect class="b-w" x="18" y="103" width="320" height="12"/><text class="s-mono" x="22" y="112">sarit    | 4471 | A1 | CONFIRMED</text>
<text class="s-xs" x="356" y="72">Three tenants can each own a booking numbered 4471.</text>
<text class="s-xs" x="356" y="85">The connection is shared; separation is a predicate.</text>
<rect class="b-rd" x="356" y="92" width="354" height="28" rx="3"/>
<text class="s-mono" x="362" y="104">SELECT * FROM booking WHERE id=4471;</text>
<text class="s-xs" x="362" y="115">→ without RLS this returns all three rows. That is the whole risk.</text>

<rect class="b-bl" x="0" y="136" width="720" height="106" rx="5"/>
<text class="s-hd" x="10" y="154">B · Schema per tenant</text>
<text class="s-xs" x="10" y="168">One database · one connection pool · a separate set of tables inside each schema</text>
<rect class="b" x="10" y="174" width="336" height="60"/>
<rect class="b-am" x="18" y="180" width="102" height="48" rx="3"/><text class="s-mono" x="24" y="192">nyati.</text><text class="s-mono" x="24" y="204">  booking</text><text class="s-mono" x="24" y="216">  seat_lock</text>
<rect class="b-gr" x="126" y="180" width="102" height="48" rx="3"/><text class="s-mono" x="132" y="192">prestige.</text><text class="s-mono" x="132" y="204">  booking</text><text class="s-mono" x="132" y="216">  seat_lock</text>
<rect class="b-pu" x="234" y="180" width="104" height="48" rx="3"/><text class="s-mono" x="240" y="192">sarit.</text><text class="s-mono" x="240" y="204">  booking</text><text class="s-mono" x="240" y="216">  seat_lock</text>
<text class="s-xs" x="356" y="188">The tenant is chosen before the query runs, by setting</text>
<text class="s-xs" x="356" y="201">the search path. Tables are physically separate objects.</text>
<rect class="b-w" x="356" y="208" width="354" height="28" rx="3"/>
<text class="s-mono" x="362" y="220">SET search_path = nyati;</text>
<text class="s-mono" x="362" y="231">SELECT * FROM booking WHERE id=4471;   → 1 row</text>

<rect class="b-gr" x="0" y="252" width="720" height="106" rx="5"/>
<text class="s-hd" x="10" y="270">C · Database per tenant</text>
<text class="s-xs" x="10" y="284">A separate database — and usually a separate connection pool, backup and credential</text>
<rect class="b" x="10" y="290" width="336" height="60"/>
<rect class="b-am" x="18" y="296" width="102" height="48" rx="3"/><text class="s-mono" x="24" y="308">nyati_db</text><text class="s-xs" x="24" y="322">own backup</text><text class="s-xs" x="24" y="336">own key</text>
<rect class="b-gr" x="126" y="296" width="102" height="48" rx="3"/><text class="s-mono" x="132" y="308">prestige_db</text><text class="s-xs" x="132" y="322">own backup</text><text class="s-xs" x="132" y="336">own key</text>
<rect class="b-pu" x="234" y="296" width="104" height="48" rx="3"/><text class="s-mono" x="240" y="308">sarit_db</text><text class="s-xs" x="240" y="322">own backup</text><text class="s-xs" x="240" y="336">own key</text>
<text class="s-xs" x="356" y="304">The tenant is chosen when the connection is opened.</text>
<text class="s-xs" x="356" y="317">A wrong query cannot reach another tenant — the rows</text>
<text class="s-xs" x="356" y="330">are not in this database and the socket does not go there.</text>
<rect class="b-w" x="356" y="336" width="354" height="18" rx="3"/>
<text class="s-mono" x="362" y="348">connect(nyati_db); SELECT … → 1 row</text>

<rect class="b-n" x="0" y="366" width="720" height="20" rx="4"/>
<text class="s-smw" x="10" y="380">Read downward and separation strengthens; read upward and efficiency, agility and operational simplicity improve. There is no free position.</text>
</svg>
