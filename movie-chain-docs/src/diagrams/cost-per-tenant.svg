<svg viewBox="0 0 720 250" role="img">
<text class="s-cap" x="0" y="11">Cost per tenant — the metric that decides whether you have a business</text>
<rect class="b-w" x="0" y="22" width="350" height="164" rx="5"/>
<text class="s-hd" x="12" y="40">What a shared bill hides</text>
<rect class="b" x="12" y="50" width="326" height="26"/><text class="s-sm" x="20" y="67">Cloud invoice: KSh 1 240 000 / month</text>
<path class="ln" d="M175 76 L175 90" marker-end="url(#ah)"/>
<rect class="b-rd" x="12" y="92" width="326" height="40"/>
<text class="s-lb mid-a" x="175" y="109">Which tenants earned it?</text>
<text class="s-xs mid-a" x="175" y="123">The invoice cannot tell you. It never will.</text>
<text class="s-sm" x="12" y="150">Without per-tenant cost you cannot answer: is our free</text>
<text class="s-sm" x="12" y="164">tier sustainable? Is this customer profitable? Should</text>
<text class="s-sm" x="12" y="178">this chain be on Premium — or be fired?</text>

<rect class="b-gr" x="370" y="22" width="350" height="164" rx="5"/>
<text class="s-hd" x="382" y="40">What attribution reveals</text>
<g>
<text class="s-sm" x="382" y="62">Nyati Cinemas</text><rect x="500" y="53" width="190" height="11" rx="2" fill="var(--navy)"/><text class="s-xs" x="694" y="62">62%</text>
<text class="s-sm" x="382" y="84">Prestige Screens</text><rect x="500" y="75" width="58" height="11" rx="2" fill="var(--blue)"/><text class="s-xs" x="562" y="84">19%</text>
<text class="s-sm" x="382" y="106">Sarit Filmhouse</text><rect x="500" y="97" width="34" height="11" rx="2" fill="var(--amber)"/><text class="s-xs" x="538" y="106">11%</text>
<text class="s-sm" x="382" y="128">184 Basic tenants</text><rect x="500" y="119" width="24" height="11" rx="2" fill="var(--green)"/><text class="s-xs" x="528" y="128">8%</text>
</g>
<rect class="b" x="382" y="140" width="326" height="38"/>
<text class="s-lb" x="390" y="156">Nyati pays for Standard and consumes like Premium.</text>
<text class="s-xs" x="390" y="170">That is now a priced conversation, not a mystery.</text>

<rect class="b-am" x="0" y="196" width="720" height="50" rx="5"/>
<text class="s-hd" x="14" y="214">How you get it</text>
<text class="s-sm" x="14" y="231">Siloed resources are easy — tag the infrastructure with the tenant and read the bill. Pooled resources need proxies: count requests,</text>
<text class="s-sm" x="14" y="243">storage bytes, compute-milliseconds per tenant, then apportion the shared bill by share of consumption. Approximate beats absent.</text>
</svg>
