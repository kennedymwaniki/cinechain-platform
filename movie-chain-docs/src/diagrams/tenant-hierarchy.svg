<text class="s-hd" x="232" y="256">The distinction that makes this system work</text>
<text class="s-sm" x="232" y="272">A <b>seat</b> is furniture — it exists whether or not a film is showing. What customers actually buy is a</text>
<text class="s-sm" x="232" y="287"><b>seat-for-a-screening</b>: seat B7, in Screen 2, for the 20:30 showing on 14 June.</text>
