<svg viewBox="0 0 720 300" role="img">
<text class="s-cap" x="0" y="11">Two customers, one seat, the same millisecond</text>
<rect class="b-rd" x="0" y="20" width="350" height="140" rx="5"/>
<text class="s-hd" x="12" y="38">The naive implementation</text>
<text class="s-mono" x="12" y="58">Grace                    Brian</text>
<path class="ln-f" d="M12 63 L338 63"/>
<text class="s-mono" x="12" y="78">SELECT status → FREE</text>
<text class="s-mono" x="182" y="93">SELECT status → FREE</text>
<text class="s-mono" x="12" y="108">UPDATE → HELD by Grace</text>
<text class="s-mono" x="182" y="123">UPDATE → HELD by Brian</text>
<rect class="b-rd" x="12" y="130" width="326" height="24" rx="3"/>
<text class="s-lb mid-a" x="175" y="146">Both told &quot;yes&quot;. Two people, seat B7.</text>

<rect class="b-gr" x="370" y="20" width="350" height="140" rx="5"/>
<text class="s-hd" x="382" y="38">Single atomic operation</text>
<text class="s-mono" x="382" y="58">Grace                    Brian</text>
<path class="ln-f" d="M382 63 L708 63"/>
<text class="s-mono" x="382" y="78">SET …NX → OK</text>
<text class="s-mono" x="552" y="93">SET …NX → nil</text>
<text class="s-mono" x="382" y="108">proceeds to payment</text>
<text class="s-mono" x="552" y="123">409 — pick another</text>
<rect class="b-gr" x="382" y="130" width="326" height="24" rx="3"/>
<text class="s-lb mid-a" x="545" y="146">Exactly one winner. Decided by Redis, not luck.</text>

<rect class="b-n" x="0" y="172" width="720" height="58" rx="5"/>
<text class="s-hdw" x="14" y="191">The principle, beyond this feature</text>
<text class="s-smw" x="14" y="209">Any check-then-act across two round trips is a race. The fix is never &quot;check more carefully&quot; — it is to collapse check and act into one</text>
<text class="s-smw" x="14" y="224">operation the datastore guarantees is indivisible: SET NX, INSERT … ON CONFLICT, UPDATE … WHERE status = 'FREE', or SELECT … FOR UPDATE.</text>

<rect class="b-am" x="0" y="240" width="720" height="56" rx="5"/>
<text class="s-hd" x="14" y="258">And keep the belt as well as the braces</text>
<text class="s-sm" x="14" y="275">Redis is the fast path, but it can be flushed, fail over, or lose a write. So <tspan class="s-mono">seat_lock</tspan> carries PRIMARY KEY (screening_id, seat_id)</text>
<text class="s-sm" x="14" y="290">in Postgres too. If Redis ever lets two winners through, the database rejects the second. Correctness must not depend on the cache.</text>
</svg>
