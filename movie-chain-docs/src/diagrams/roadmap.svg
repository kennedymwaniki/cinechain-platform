</g>
<rect class="b-rd" x="150" y="264" width="570" height="14" rx="3"/>
<text class="s-xs" x="158" y="274">Sequencing rule: tenancy is in P0. Retrofitting tenant_id onto a live schema is the most expensive mistake available.</text>
