<svg viewBox="0 0 720 336" role="img">
<text class="s-cap" x="0" y="11">Two ways in, one booking — the tenant is never chosen by the customer</text>

<rect class="b" x="0" y="20" width="130" height="52"/>
<text class="s-hd mid-a" x="65" y="40">Grace arrives</text><text class="s-xs mid-a" x="65" y="55">no account, no login</text>
<path class="ln-a" d="M130 46 L156 46" marker-end="url(#ah-a)"/>
<rect class="b-am" x="156" y="20" width="130" height="52"/>
<text class="s-hd mid-a" x="221" y="40">Picks a cinema</text><text class="s-xs mid-a" x="221" y="55">&quot;Garden City&quot;</text>
<path class="ln-a" d="M286 46 L312 46" marker-end="url(#ah-a)"/>
<rect class="b-am" x="312" y="20" width="130" height="52"/>
<text class="s-hd mid-a" x="377" y="40">Film · date · time</text><text class="s-xs mid-a" x="377" y="55">4:30 PM, Cinema 2</text>
<path class="ln-a" d="M442 46 L468 46" marker-end="url(#ah-a)"/>
<rect class="b-am" x="468" y="20" width="130" height="52"/>
<text class="s-hd mid-a" x="533" y="40">Picks seat E3</text><text class="s-xs mid-a" x="533" y="55">5:00 countdown starts</text>
<path class="ln-a" d="M598 46 L624 46" marker-end="url(#ah-a)"/>
<rect class="b-gr" x="624" y="20" width="96" height="52"/>
<text class="s-hd mid-a" x="672" y="40">Name, email</text><text class="s-xs mid-a" x="672" y="55">pay · ticket sent</text>

<path class="ln-b" d="M221 72 L221 96" marker-end="url(#ah-b)"/>
<rect class="b-bl" x="0" y="96" width="442" height="56" rx="5"/>
<text class="s-hd" x="10" y="114">The tenant was decided here — by the server, not the customer</text>
<text class="s-sm" x="10" y="131">Choosing &quot;Garden City&quot; selects a theatre, and the theatre belongs to a tenant. The API reads</text>
<text class="s-sm" x="10" y="146"><tspan class="s-mono">screening.tenant_id</tspan> from the screening id. Grace never sees the word &quot;tenant&quot; and never asserts one.</text>

<rect class="b-am" x="458" y="96" width="262" height="56" rx="5"/>
<text class="s-hd" x="468" y="114">The hold belongs to a token, not a user</text>
<text class="s-mono" x="468" y="131">sign({hold_id, screening_id, exp})</text>
<text class="s-xs" x="468" y="146">Opaque, signed, 5-minute life. No account needed</text>

<text class="s-cap" x="0" y="178">If instead Grace has a CineChain account</text>
<rect class="b" x="0" y="186" width="150" height="46"/>
<text class="s-lb mid-a" x="75" y="204">Logs in — once</text><text class="s-xs mid-a" x="75" y="218">token has NO tenant_id</text>
<path class="ln-g" d="M150 209 L176 209" marker-end="url(#ah-g)"/>
<rect class="b-gr" x="176" y="186" width="196" height="46"/>
<text class="s-lb mid-a" x="274" y="204">Sees every chain's cinemas</text><text class="s-xs mid-a" x="274" y="218">Nyati, Prestige, Sarit — all of them</text>
<path class="ln-g" d="M372 209 L398 209" marker-end="url(#ah-g)"/>
<rect class="b-gr" x="398" y="186" width="150" height="46"/>
<text class="s-lb mid-a" x="473" y="204">Books anywhere</text><text class="s-xs mid-a" x="473" y="218">same flow as above</text>
<path class="ln-g" d="M548 209 L574 209" marker-end="url(#ah-g)"/>
<rect class="b-am" x="574" y="186" width="146" height="46"/>
<text class="s-lb mid-a" x="647" y="204">Loyalty accrues</text><text class="s-xs mid-a" x="647" y="218">per chain, independently</text>

<rect class="b-n" x="0" y="246" width="720" height="48" rx="5"/>
<text class="s-hdw" x="12" y="264">Why this is the Uber-and-Bolt model</text>
<text class="s-smw" x="12" y="281">One identity, many providers. Grace holds Nyati points and Prestige points from a single login, and neither chain sees the other's</text>
<text class="s-smw" x="12" y="291">balance — because loyalty hangs off the per-tenant link record, never off her platform identity.</text>

<rect class="b-rd" x="0" y="302" width="720" height="34" rx="5"/>
<text class="s-lb" x="12" y="318">The property that makes it safe</text>
<text class="s-sm" x="12" y="331">A chain reads the customers who transacted with <tspan font-weight="700">it</tspan>. No chain can read the platform consumer list — that table lives outside the tenant boundary.</text>
</svg>
