<rect class="b-am" x="486" y="0" width="234" height="126" rx="5"/>
<text class="s-hd" x="496" y="18">What the timer really means</text>
<text class="s-sm" x="496" y="36">The countdown is not decoration. It is the</text>
<text class="s-sm" x="496" y="50">visible face of a Redis TTL. When it reaches</text>
<text class="s-sm" x="496" y="64">zero the seats genuinely return to sale —</text>
<text class="s-sm" x="496" y="78">whether or not this browser is still open.</text>
<text class="s-sm" x="496" y="98">Always render it from the server's</text>
<text class="s-sm" x="496" y="112"><tspan class="s-mono">expires_at</tspan>, never a client-side counter.</text>

<rect class="b-w" x="486" y="136" width="234" height="164" rx="5"/>
<text class="s-hd" x="496" y="154">Details that decide whether</text>
<text class="s-hd" x="496" y="168">people finish the booking</text>
<text class="s-sm" x="496" y="188">·  Grey out, never hide, taken seats —</text>
<text class="s-sm" x="496" y="201">   people navigate by shape</text>
<text class="s-sm" x="496" y="219">·  Refuse to leave a single orphan seat</text>
<text class="s-sm" x="496" y="232">   between two bookings</text>
<text class="s-sm" x="496" y="250">·  Warn at 60 seconds, offer one extension</text>
<text class="s-sm" x="496" y="268">·  Push seat-map changes over WebSocket —</text>
<text class="s-sm" x="496" y="281">   nothing is worse than clicking a seat</text>
<text class="s-sm" x="496" y="294">   that was sold 20 seconds ago</text>
</svg>
